<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Flowboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand"><b>C</b>UESHEET BOARD</div>
      <div class="meta">SAMPLE SET</div>
      <div class="tools">
        <a class="smallbtn" data-link="repo" hidden></a>
        <a class="smallbtn" data-link="scores" target="_blank" rel="noopener" hidden></a>
        <button class="smallbtn" id="export" aria-haspopup="dialog">輸出</button>
        <button class="smallbtn" id="share">複製分享連結</button>
        <button class="smallbtn" id="reset">重設配置</button>
      </div>
    </header>
    <main class="layout" id="app" aria-label="歌曲與影片預演板">
      <section class="panel">
        <header class="panelhead">
          <div>
            <h2>歌曲</h2>
            <div class="sub">拖曳排序 · 選歌配 loop</div>
            <div class="loopcount" id="loopCount">0 / 0 首已有 loop</div>
          </div>
          <input
            id="search"
            class="search"
            aria-label="搜尋歌曲或影片"
            placeholder="搜尋歌曲…"
          />
        </header>
        <details class="section-manager" id="sectionManager">
          <summary>＋ 新增段落</summary>
          <div class="section-manager-body">
            <div id="sectionGroups" class="section-groups"></div>
            <form id="sectionForm" class="section-form">
              <input name="name" type="text" maxlength="40" aria-label="新段落名稱" placeholder="例如：懷舊／電影歌" required />
              <label>顏色 <input name="color" type="color" value="#8b6df6" aria-label="段落顏色" /></label>
              <button type="submit" class="smallbtn">＋新增段落</button>
            </form>
          </div>
        </details>
        <div id="songs" class="songs"></div>
        <div class="trackadd">
          <button id="trackAdd" type="button" class="smallbtn" aria-expanded="false" aria-controls="trackForm" title="貼 Suno 或 Spotify 連結，或揀本機音訊檔，加入歌單">＋ 加歌（連結／檔案）</button>
          <form id="trackForm" class="trackform" hidden>
            <input name="url" class="search" type="url" aria-label="Suno 或 Spotify 連結" placeholder="貼 suno.com／open.spotify.com 連結" />
            <label class="filepick">或揀本機音訊檔（mp3／wav／m4a／flac，只存喺呢個瀏覽器）<input name="file" type="file" accept="audio/*" /></label>
            <input name="title" class="search" type="text" aria-label="歌名（可留空）" placeholder="歌名（可留空）" />
            <button type="submit" class="smallbtn">加入歌單</button>
            <div class="trackerr" role="alert"></div>
          </form>
        </div>
        <details class="mi-list" id="miList" hidden>
          <summary id="miListTitle">M+ MI list</summary>
          <div class="mi-list-content" id="miListContent"></div>
        </details>
      </section>
      <section class="panel center">
        <div class="now">
          <div class="nowtext">
            <strong id="nowTitle">選擇歌曲或影片</strong
            ><small id="nowMeta">loop 會在此頁內嵌播放</small>
          </div>
          <div class="viewbar" role="group" aria-label="顯示內容" id="viewbar">
          <button data-view="video" aria-pressed="true">影片</button>
          <button data-view="stage" aria-pressed="false">舞台</button>
          <button data-view="timeline" aria-pressed="false">時間線</button>
          <button data-view="lyrics" aria-pressed="false">歌詞</button>
          <button data-view="charts" aria-pressed="false">譜</button>
          <button id="songsBtn" type="button" aria-pressed="true" class="viewlib" title="收埋／展開左邊歌單，畀中間更闊">歌單</button>
          <button data-view="library" aria-pressed="true" class="viewlib">素材庫</button>
          <button id="dockBtn" type="button" aria-pressed="true" class="viewlib" title="收埋／展開舞台下面嘅 loop 組合欄，畀舞台更大">Loop 欄</button>
          </div>
          <button id="clearVideo" class="smallbtn">停止影片</button>
        </div>
        <div class="panels" id="panels" data-count="1">
          <div class="pane" data-pane="video">
        <div class="videohold">
          <video id="vplayer" class="video" muted playsinline preload="metadata" hidden></video>
          <iframe
            id="video"
            class="video"
            title="影片預覽播放器"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </div>
        <div id="status" class="hint" role="status">
          選取 loop 後會在此播放。
        </div>
          </div>
          <div class="pane" data-pane="stage" hidden><div id="stagebox" class="stagebox"></div></div>
          <div class="pane" data-pane="three" hidden><div id="threebox" class="threebox"></div></div>
          <div class="pane" data-pane="lyrics" hidden></div>
        </div>
        <section class="scoredock" id="scoredock" data-pane="charts" aria-label="譜" hidden>
          <div class="scorehandle" id="scorehandle" role="separator" aria-orientation="horizontal" tabindex="0" title="拖動調整譜嘅高度" aria-label="拖動調整譜嘅高度"></div>
          <div class="scorebody" id="scorebody"></div>
        </section>
        <div class="dock" id="dock" data-dock="full">
        <div class="assignments">
          <div class="assignhead">
            <span id="assignTitle">此歌的 loop 組合</span
            ><span>拖曳縮圖重排；拖入歌曲可重新配歌</span>
          </div>
          <div class="assigned" id="assigned"></div>
        </div>
        </div>
      </section>
      <section class="panel rightcol" id="rightcol">
        <div class="tlpanel" id="tlpanel" hidden>
          <header class="panelhead"><h2>時間線</h2></header>
          <div id="timelinebox" class="stagebox"></div>
        </div>
        <div class="libpanel" id="libpanel">
          <header class="panelhead">
            <div>
              <h2 id="libTitle">影片 loop</h2>
              <div class="sub">真實檔名 · 點選播放／配入目前歌曲</div>
            </div>
            <div class="tools">
              <span class="pill exact">EXACT</span><span class="pill candidate">CANDIDATE</span
              ><span class="pill section">SECTION</span
              ><button id="videoAdd" type="button" class="smallbtn" title="揀本機影片加入素材庫（只存喺呢個瀏覽器）">＋ 加影片</button><input id="videoFile" type="file" accept="video/*" multiple hidden /><button id="libToggle" class="smallbtn" aria-expanded="true" aria-controls="library" title="收埋／展開素材庫" aria-label="收埋素材庫">▾</button>
            </div>
          </header>
          <div id="library" class="library"></div>
          <div class="libraryfoot">
            縮圖為同站快取；選取才載入影片。
          </div>
        </div>
      </section>
    </main>
    <div class="playerbar" id="playerbar">
    <div class="embedrow" id="embedRow" hidden>
      <span class="embedhint" role="status">內嵌播放唔同步時間線</span>
    </div>
    <div class="player" id="player">
      <button id="prevSong" class="pbtn" aria-label="上一首歌曲" title="上一首"></button>
      <button id="playBtn" class="pbtn play" aria-label="播放" title="播放／暫停（空白鍵）"></button>
      <button id="nextSong" class="pbtn" aria-label="下一首歌曲" title="下一首"></button>
      <button id="autoNext" class="pbtn autonext" type="button" aria-pressed="true" aria-label="連播" title="連播">連播</button>
      <div class="np"><strong id="npTitle">—</strong><small id="npSub">歌曲排練音訊</small></div>
      <div id="versions" class="versions" aria-label="音訊版本" hidden></div>
      <span class="time" id="tCur">0:00</span>
      <input id="seek" class="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="播放位置" />
      <span class="time" id="tDur">0:00</span>
      <button id="muteBtn" class="pbtn" aria-label="靜音" title="靜音"></button>
      <input id="vol" class="vol" type="range" min="0" max="100" value="100" aria-label="音量" />
      <button id="dockToggle" class="pbtn dockbtn" aria-expanded="true" aria-label="收埋下欄" title="收埋／展開下欄（loop 組合）"></button>
      <audio id="audio" preload="none"></audio>
    </div>
    </div>
    <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.min.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
    <script src="people.js"></script>
    <script src="stage.js"></script>
    <script src="app.js"></script>
  </body>
</html>
