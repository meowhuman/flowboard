name: Tests

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 25
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Serve and test
        run: |
          python3 qa/range-server.py 9424 . 127.0.0.1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9424/index.html > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:9424/index.html > /dev/null || exit 1
          npm test
